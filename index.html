<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YKS & Tatil Sayaç</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* --- GENEL --- */
* {margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}
body {
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:20px;
  background: linear-gradient(-45deg, #f0f9ff, #e0f2fe, #bae6fd, #7dd3fc);
  background-size: 400% 400%;
  animation: gradientBG 15s ease infinite;
  transition: background 0.5s, color 0.5s;
  color:#1f2937;
}
h1,h2{text-align:center;margin-bottom:20px;color:#0f172a;}
button{cursor:pointer;border:none;font-weight:600;border-radius:10px;padding:12px 20px;transition:all 0.3s;}
/* --- CARD --- */
.card{
  background:#fff;
  border-radius:15px;
  box-shadow:0 8px 25px rgba(0,0,0,0.1);
  padding:25px;
  margin:20px 0;
  width:100%;
  max-width:500px;
  transition: transform 0.4s ease, box-shadow 0.4s ease, background 0.4s ease;
  perspective:1000px;
}
.card:hover{
  transform: rotateY(3deg) rotateX(3deg) translateY(-8px);
  box-shadow:0 15px 35px rgba(0,0,0,0.2);
  background: linear-gradient(135deg, #f3f4f6, #e0f2fe);
}

/* --- SAYAC --- */
#countdown{
  display:flex;justify-content:space-around;margin-top:20px;font-size:2rem;font-weight:700;
}
#countdown div span{display:block;font-size:2rem;color:#1e40af;}
/* --- FORM --- */
.form-group{margin-bottom:15px;}
.form-group label{display:block;margin-bottom:5px;font-weight:600;}
.form-group input{width:100%;padding:10px 12px;border-radius:8px;border:1px solid #cbd5e1;font-size:1rem;}
button{width:100%;background:#1e40af;color:#fff;font-size:1rem;}
button:hover{background:#3b82f6;}
#result{margin-top:20px;text-align:center;font-weight:600;}
/* --- PROGRESS BAR --- */
.progress-bar{margin-bottom:15px;}
.progress-bar label{display:block;font-weight:600;margin-bottom:5px;}
.bar{width:100%;background:#e5e7eb;border-radius:12px;height:25px;overflow:hidden;position:relative;}
.bar div{
  height:100%;
  width:0%;
  border-radius:12px;
  background:linear-gradient(90deg,#3b82f6,#06b6d4);
  display:flex;align-items:center;justify-content:flex-end;
  padding-right:10px;font-weight:600;color:#fff;
  transition:width 1s ease,background 1s ease;
}
.bar div::after{content:attr(data-percent) '%';font-size:0.9rem;margin-left:5px;opacity:0;transition:opacity 0.3s;}
.bar div:hover::after{opacity:1;}
/* --- KÜÇÜK BİLGİ KARTLARI --- */
.card ul{margin-top:10px;padding-left:20px;}
.card ul li{margin-bottom:6px;}
.card p{line-height:1.5;}
/* --- DARK MODE --- */
body.dark{
  background: linear-gradient(to bottom right,#0f172a,#1e293b);
  color:#f1f5f9;
}
body.dark .card{background:#1e293b;color:#f1f5f9;}
body.dark .result-card{color:#f1f5f9;}
body.dark button{background:#3b82f6;color:#fff;}
body.dark .bar div{background:linear-gradient(90deg,#60a5fa,#22d3ee);color:#f1f5f9;}
/* --- ANIMATIONS --- */
@keyframes gradientBG{0%{background-position:0% 50%;}50%{background-position:100% 50%;}100%{background-position:0% 50%;}}
.result-card{padding:15px 20px;border-radius:12px;font-weight:700;margin:10px 0;text-align:center;color:#0f172a;box-shadow:0 6px 15px rgba(0,0,0,0.08);transition: all 0.5s ease, transform 0.5s ease;}
.result-card:hover{transform: scale(1.08) rotateZ(2deg);box-shadow:0 20px 40px rgba(0,0,0,0.2);}
@media(max-width:480px){body{padding:15px}.card{padding:15px 10px;border-radius:12px}#countdown{flex-direction:column;font-size:1.3rem;gap:10px}button{font-size:0.95rem}}
</style>
</head>
<body>

<h1>🎓 YKS & Tatil Sayaç</h1>

<!-- Tema Toggle -->
<div style="text-align:center; margin-bottom:20px;">
  <button id="themeToggle">🌙 Karanlık Mod</button>
</div>

<!-- Sayaç Kartı -->
<div class="card">
  <h2>Okulların Kapanmasına Kalan Süre</h2>
  <div id="countdown">
    <div><span id="days">0</span>Gün</div>
    <div><span id="hours">0</span>Saat</div>
    <div><span id="minutes">0</span>Dakika</div>
    <div><span id="seconds">0</span>Saniye</div>
  </div>
</div>

<!-- Net Hesaplama Kartı -->
<div class="card">
  <h2>YKS Net Hesaplama & Puan</h2>
  <div class="form-group">
    <label for="tytCorrect">TYT Doğru</label>
    <input type="number" id="tytCorrect" min="0" max="120" value="0">
  </div>
  <div class="form-group">
    <label for="tytWrong">TYT Yanlış</label>
    <input type="number" id="tytWrong" min="0" max="120" value="0">
  </div>
  <div class="form-group">
    <label for="aytCorrect">AYT Doğru</label>
    <input type="number" id="aytCorrect" min="0" max="160" value="0">
  </div>
  <div class="form-group">
    <label for="aytWrong">AYT Yanlış</label>
    <input type="number" id="aytWrong" min="0" max="160" value="0">
  </div>
  <div class="form-group">
    <label for="ydtCorrect">YDT Doğru</label>
    <input type="number" id="ydtCorrect" min="0" max="80" value="0">
  </div>
  <div class="form-group">
    <label for="ydtWrong">YDT Yanlış</label>
    <input type="number" id="ydtWrong" min="0" max="80" value="0">
  </div>
  <div class="form-group">
    <label for="obp">OBP (0-100)</label>
    <input type="number" id="obp" min="0" max="100" value="0">
  </div>
  <button onclick="calculateNetAdvanced()">Tüm Netleri Hesapla</button>
  <div id="result">Netler burada görünecek</div>
</div>

<!-- Net Yüzdeleri -->
<div class="card">
  <h2>📊 Net Yüzdeleri</h2>
  <div class="progress-bar">
    <label>TYT:</label>
    <div class="bar"><div id="tytProgress" data-percent="0">0%</div></div>
  </div>
  <div class="progress-bar">
    <label>AYT:</label>
    <div class="bar"><div id="aytProgress" data-percent="0">0%</div></div>
  </div>
  <div class="progress-bar">
    <label>YDT:</label>
    <div class="bar"><div id="ydtProgress" data-percent="0">0%</div></div>
  </div>
</div>

<script>
// --- Sayaç ---
function countdown(){
  const target=new Date("2026-01-16T00:00:00");
  const now=new Date();
  const diff=target-now;
  if(diff<=0){
    document.getElementById("countdown").innerHTML='<div style="color:#dc2626;font-weight:700;">Tatiller başladı! 🎉</div>';
    return;
  }
  const days=Math.floor(diff/(1000*60*60*24));
  const hours=Math.floor((diff/(1000*60*60))%24);
  const minutes=Math.floor((diff/(1000*60))%60);
  const seconds=Math.floor((diff/1000)%60);
  document.getElementById("days").textContent=days;
  document.getElementById("hours").textContent=hours;
  document.getElementById("minutes").textContent=minutes;
  document.getElementById("seconds").textContent=seconds;
}
setInterval(countdown,1000);

// --- Tema ---
const themeToggle=document.getElementById("themeToggle");
themeToggle.addEventListener("click",()=>{
  document.body.classList.toggle("dark");
  themeToggle.textContent=document.body.classList.contains("dark")?"☀️ Açık Mod":"🌙 Karanlık Mod";
});

// --- Net Hesaplama ---
function calculateNetAdvanced(){
  const tytC=parseInt(document.getElementById("tytCorrect").value)||0;
  const tytW=parseInt(document.getElementById("tytWrong").value)||0;
  const aytC=parseInt(document.getElementById("aytCorrect").value)||0;
  const aytW=parseInt(document.getElementById("aytWrong").value)||0;
  const ydtC=parseInt(document.getElementById("ydtCorrect").value)||0;
  const ydtW=parseInt(document.getElementById("ydtWrong").value)||0;
  const obp=parseFloat(document.getElementById("obp").value)||0;

  const tytNet=Math.max(0,(tytC-tytW/4).toFixed(2));
  const aytNet=Math.max(0,(aytC-aytW/4).toFixed(2));
  const ydtNet=Math.max(0,(ydtC-ydtW/4).toFixed(2));

  const tytScore=(tytNet*3+obp*0.12).toFixed(2);
  const aytScore=(aytNet*3+obp*0.12).toFixed(2);
  const ydtScore=(ydtNet*3+obp*0.12).toFixed(2);

  const resultDiv=document.getElementById("result");
  resultDiv.innerHTML=`
    <div class="result-card" style="background:#e0f7fa;">TYT Net: <strong>${tytNet}</strong> | Puan: <strong>${tytScore}</strong></div>
    <div class="result-card" style="background:#f1f8e9;">AYT Net: <strong>${aytNet}</strong> | Puan: <strong>${aytScore}</strong></div>
    <div class="result-card" style="background:#fff3e0;">YDT Net: <strong>${ydtNet}</strong> | Puan: <strong>${ydtScore}</strong></div>
  `;
  updateProgressBars();
  animateResultCards();
}

// --- Progress Bar ---
function updateProgressBars(){
  const tytC=parseInt(document.getElementById("tytCorrect").value)||0;
  const aytC=parseInt(document.getElementById("aytCorrect").value)||0;
  const ydtC=parseInt(document.getElementById("ydtCorrect").value)||0;
  const tytMax=120,aytMax=160,ydtMax=80;
  const tytP=Math.min((tytC/tytMax*100),100).toFixed(0);
  const aytP=Math.min((aytC/aytMax*100),100).toFixed(0);
  const ydtP=Math.min((ydtC/ydtMax*100),100).toFixed(0);
  const tytBar=document.getElementById("tytProgress");
  const aytBar=document.getElementById("aytProgress");
  const ydtBar=document.getElementById("ydtProgress");
  tytBar.style.width=tytP+"%"; aytBar.style.width=aytP+"%"; ydtBar.style.width=ydtP+"%";
  tytBar.setAttribute("data-percent",tytP); aytBar.setAttribute("data-percent",aytP); ydtBar.setAttribute("data-percent",ydtP);
}

// --- Net Kart Animasyonu ---
function animateResultCards(){
  const cards=document.querySelectorAll('.result-card');
  cards.forEach((card,index)=>{
    card.style.opacity=0;
    card.style.transform='translateY(30px) scale(0.95)';
    setTimeout(()=>{
      card.style.transition='all 0.6s cubic-bezier(0.68,-0.55,0.27,1.55)';
      card.style.opacity=1;
      card.style.transform='translateY(0) scale(1)';
    },index*250);
  });
}
</script>

</body>
</html>
