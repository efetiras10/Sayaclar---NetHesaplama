<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sayaçlar & Net Hesaplama</title>

  <!-- Tema -->
  <style>
    :root {
      --bg1:#0f172a;
      --bg2:#1e293b;
      --card:#1e293b;
      --text:#f1f5f9;
      --muted:#94a3b8;
      --accent:#3b82f6;
      --border:#334155;
    }

    * { box-sizing:border-box; }

    body {
      margin:0;
      font-family:Segoe UI, Roboto, Arial, sans-serif;
      background:linear-gradient(120deg,var(--bg1),var(--bg2));
      color:var(--text);
    }

    header {
      text-align:center;
      padding:16px;
      font-size:22px;
      font-weight:600;
      border-bottom:1px solid var(--border);
    }

    .container {
      max-width:900px;
      margin:auto;
      padding:16px;
    }

    .card {
      background:var(--card);
      border:1px solid var(--border);
      border-radius:16px;
      padding:18px;
      margin-bottom:20px;
      box-shadow:0 8px 20px rgba(0,0,0,.4);
    }

    h2 { margin-top:0; }

    .menu {
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-bottom:12px;
    }

    button {
      background:var(--accent);
      color:#fff;
      border:none;
      padding:10px 16px;
      border-radius:10px;
      cursor:pointer;
      font-size:15px;
    }

    button:hover { opacity:.9; }

    .section { display:none; }
    .section.active { display:block; }

    .countdown {
      font-size:18px;
      margin-top:10px;
    }

    input[type="number"] {
      width:100%;
      max-width:260px;
      padding:8px;
      margin:6px 0 12px;
      border-radius:8px;
      border:1px solid var(--border);
      background:var(--bg2);
      color:var(--text);
    }

    .note {
      font-size:13px;
      color:var(--muted);
      margin-top:8px;
    }

    @media (max-width:600px) {
      header { font-size:19px; }
      button { width:100%; }
    }
  </style>
</head>

<body>

<header>📚 Sayaçlar & Net Hesaplama</header>

<div class="container">

  <!-- ================= SAYAÇLAR ================= -->
  <div class="card">
    <h2>📅 Geri Sayım Sayaçları</h2>

    <div class="menu">
      <button onclick="showCounter('summer')">Yaz Tatili</button>
      <button onclick="showCounter('lgs')">LGS</button>
      <button onclick="showCounter('tyt')">TYT</button>
      <button onclick="showCounter('ayt')">AYT</button>
    </div>

    <div id="summer" class="section active">
      <p>Yaz tatiline kalan süre:</p>
      <div id="summerC" class="countdown"></div>
    </div>

    <div id="lgs" class="section">
      <p>LGS'ye kalan süre:</p>
      <div id="lgsC" class="countdown"></div>
    </div>

    <div id="tyt" class="section">
      <p>TYT'ye kalan süre:</p>
      <div id="tytC" class="countdown"></div>
    </div>

    <div id="ayt" class="section">
      <p>AYT'ye kalan süre:</p>
      <div id="aytC" class="countdown"></div>
    </div>
  </div>

  <!-- ================= NET HESAPLAMA ================= -->
  <div class="card">
    <h2>🧮 Net Hesaplama</h2>

    <div class="menu">
      <button onclick="showCalc('tytCalc')">TYT</button>
      <button onclick="showCalc('aytCalc')">AYT</button>
      <button onclick="showCalc('lgsCalc')">LGS</button>
    </div>

    <!-- TYT -->
    <div id="tytCalc" class="section active">
      <label>Türkçe Net</label>
      <input type="number" id="tTr" min="0" max="40">
      <label>Matematik Net</label>
      <input type="number" id="tMat" min="0" max="40">
      <label>Fen Net</label>
      <input type="number" id="tFen" min="0" max="20">
      <label>Sosyal Net</label>
      <input type="number" id="tSos" min="0" max="20">
      <button onclick="hesaplaTYT()">Hesapla</button>
      <div id="tSonuc" class="countdown"></div>
    </div>

    <!-- AYT -->
    <div id="aytCalc" class="section">
      <label>Matematik Net</label>
      <input type="number" id="aMat">
      <label>Fizik Net</label>
      <input type="number" id="aFiz">
      <label>Kimya Net</label>
      <input type="number" id="aKim">
      <label>Biyoloji Net</label>
      <input type="number" id="aBio">
      <button onclick="hesaplaAYT()">Hesapla</button>
      <div id="aSonuc" class="countdown"></div>
    </div>

    <!-- LGS -->
    <div id="lgsCalc" class="section">
      <label>Türkçe Net</label>
      <input type="number" id="lTr">
      <label>Matematik Net</label>
      <input type="number" id="lMat">
      <label>Fen Net</label>
      <input type="number" id="lFen">
      <button onclick="hesaplaLGS()">Hesapla</button>
      <div id="lSonuc" class="countdown"></div>
    </div>

    <p class="note">Bu hesaplamalar tahminidir, ÖSYM/MEB resmî hesaplama değildir.</p>
  </div>

</div>

<script>
  // Sayaç sekmeleri
  function showCounter(id){
    document.querySelectorAll('.card .section').forEach(s=>s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  // Net sekmeleri
  function showCalc(id){
    document.querySelectorAll('#netHesaplama .section');
    document.querySelectorAll('.card:nth-of-type(2) .section').forEach(s=>s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  function start(el, date){
    function tick(){
      const d = date - new Date().getTime();
      if(d<=0){ el.textContent="Süre doldu"; return; }
      el.textContent =
        Math.floor(d/86400000)+"g "+
        Math.floor(d/3600000)%24+"s "+
        Math.floor(d/60000)%60+"d "+
        Math.floor(d/1000)%60+"sn";
    }
    tick(); setInterval(tick,1000);
  }

  start(summerC, new Date("2026-06-15").getTime());
  start(lgsC, new Date("2026-06-14T09:30").getTime());
  start(tytC, new Date("2026-06-13T10:00").getTime());
  start(aytC, new Date("2026-06-14T10:00").getTime());

  function hesaplaTYT(){
    const p =
      (+tTr.value||0)*3.3 +
      (+tMat.value||0)*3.3 +
      (+tFen.value||0)*3.4 +
      (+tSos.value||0)*3.4;
    tSonuc.textContent = "Tahmini TYT Puanı: " + p.toFixed(2);
  }

  function hesaplaAYT(){
    const p =
      (+aMat.value||0)*3 +
      (+aFiz.value||0)*2.9 +
      (+aKim.value||0)*3 +
      (+aBio.value||0)*3.1;
    aSonuc.textContent = "Tahmini AYT Puanı: " + p.toFixed(2);
  }

  function hesaplaLGS(){
    const p =
      (+lTr.value||0)*4 +
      (+lMat.value||0)*4.5 +
      (+lFen.value||0)*4.5;
    lSonuc.textContent = "Tahmini LGS Puanı: " + p.toFixed(2);
  }
</script>

</body>
</html>
