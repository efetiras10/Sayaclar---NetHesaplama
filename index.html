<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Yaz Tatili ve Sınav Sayaçları</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #74ebd5, #ACB6E5);
      margin: 0;
      padding: 0;
      color: #333;
      text-align: center;
    }
    header {
      background: linear-gradient(to right, #4A00E0, #8E2DE2);
      color: white;
      padding: 15px;
      font-size: 24px;
      font-weight: bold;
    }
    .menu-bar {
      display: flex;
      justify-content: center; /* Ortada */
      margin-top: 10px;
    }
    .menu-container {
      position: relative;
      display: inline-block;
    }
    .menu-button {
      background: #2c003e;
      color: #fff;
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }
    .menu-button:hover {
      background: #5a189a;
    }
    .dropdown {
      display: none;
      position: absolute;
      background: #fff;
      min-width: 200px;
      box-shadow: 0 6px 12px rgba(0,0,0,0.2);
      border-radius: 8px;
      z-index: 1;
    }
    .dropdown button {
      width: 100%;
      padding: 10px;
      border: none;
      background: none;
      text-align: left;
      cursor: pointer;
      font-size: 14px;
      color: #333;
    }
    .dropdown button:hover {
      background: #f0f0f0;
    }
    .countdown, .section {
      margin: 20px auto;
      font-size: 18px;
      background: white;
      padding: 15px;
      border-radius: 12px;
      width: 80%;
      box-shadow: 0 6px 14px rgba(0,0,0,0.25);
    }
    .section { display: none; }

    /* Mobil uyum */
    @media (max-width: 600px) {
      header {
        font-size: 20px;
        padding: 10px;
      }
      .menu-button {
        font-size: 14px;
        padding: 8px 12px;
      }
      .countdown, .section {
        width: 95%;
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <header>🎉 Sayaçlar 🎉</header>

  <div class="menu-bar">
    <div class="menu-container">
      <button class="menu-button" onclick="toggleMenu('sayaçMenu')">☰ Sayaçlar</button>
      <div id="sayaçMenu" class="dropdown">
        <button onclick="showSection('summer')">Yaz Tatili Sayaç</button>
        <button onclick="showSection('ara')">Ara Tatil Sayaç</button>
        <button onclick="showSection('lgs')">LGS Sayaç</button>
        <button onclick="showSection('yks')">YKS Sayaç</button>
        <button onclick="showSection('tyt')">TYT Sayaç</button>
        <button onclick="showSection('ayt')">AYT Sayaç</button>
      </div>
    </div>
  </div>

  <!-- Yaz Tatili Geri Sayım -->
  <div id="summer" class="countdown">
    <h2>Yaz Tatiline Kalan Süre</h2>
    <p id="summerCountdown"></p>
  </div>

  <!-- Ara Tatil Geri Sayım -->
  <div id="ara" class="section">
    <h2>Ara Tatiline Kalan Süre</h2>
    <p id="araCountdown"></p>
  </div>

  <!-- Sayaçlar -->
  <div id="lgs" class="section"><h2>LGS Sayaç</h2><p id="lgsCountdown"></p></div>
  <div id="yks" class="section"><h2>YKS Sayaç</h2><p id="yksCountdown"></p></div>
  <div id="tyt" class="section"><h2>TYT Sayaç</h2><p id="tytCountdown"></p></div>
  <div id="ayt" class="section"><h2>AYT Sayaç</h2><p id="aytCountdown"></p></div>

  <script>
    // Hamburger menü aç/kapat
    function toggleMenu(id) {
      const menu = document.getElementById(id);
      menu.style.display = (menu.style.display === "block") ? "none" : "block";
    }

    // Bölüm gösterme
    function showSection(sectionId) {
      document.querySelectorAll(".countdown, .section").forEach(sec => sec.style.display = "none");
      document.getElementById(sectionId).style.display = "block";
      // Menü kapat
      document.getElementById("sayaçMenu").style.display = "none";
    }

    // Yaz Tatili Geri Sayım
    const summerDate = new Date("June 15, 2026 00:00:00").getTime();
    setInterval(() => {
      const now = new Date().getTime();
      const distance = summerDate - now;
      const days = Math.floor(distance / (1000*60*60*24));
      const hours = Math.floor((distance % (1000*60*60*24)) / (1000*60*60));
      const minutes = Math.floor((distance % (1000*60*60)) / (1000*60));
      const seconds = Math.floor((distance % (1000*60)) / 1000);
      document.getElementById("summerCountdown").innerText =
        `${days} Gün ${hours} Saat ${minutes} Dakika ${seconds} Saniye kaldı`;
    }, 1000);

    // Ara Tatil Geri Sayım (örnek: 15 Kasım 2026)
    const araDate = new Date("November 15, 2026 00:00:00").getTime();
    setInterval(() => {
      const now = new Date().getTime();
      const distance = araDate - now;
      const days = Math.floor(distance / (1000*60*60*24));
      const hours = Math.floor((distance % (1000*60*60*24)) / (1000*60*60));
      const minutes = Math.floor((distance % (1000*60*60)) / (1000*60));
      const seconds = Math.floor((distance % (1000*60)) / 1000);
      document.getElementById("araCountdown").innerText =
        `${days} Gün ${hours} Saat ${minutes} Dakika ${seconds} Saniye kaldı`;
    }, 1000);

    // Sayaçlar için örnek tarihler
    const lgsDate = new Date("June 7, 2026 10:00:00").getTime();
    const yksDate = new Date("June 20, 2026 10:00:00").getTime();
    const tytDate = new Date("June 20, 2026 10:00:00").getTime();
    const aytDate = new Date("June 21, 2026 10:00:00").getTime();

    function updateCountdown(id, targetDate) {
      setInterval(() => {
        const now = new Date().getTime();
        const distance = targetDate - now;
        const days = Math.floor(distance / (1000*60*60*24));
        const hours = Math.floor((distance % (1000*60*60*24)) / (1000*60*60));
        const minutes = Math.floor((distance % (1000*60*60)) / (1000*60));
        const seconds = Math.floor((distance % (1000*60)) / 1000);
        document.getElementById(id).innerText =
          `${days} Gün ${hours} Saat ${minutes} Dakika ${seconds} Saniye kaldı`;
      }, 1000);
    }

    updateCountdown("lgsCountdown", lgsDate);
    updateCountdown("yksCountdown", yksDate);
    updateCountdown("tytCountdown", tytDate);
    updateCountdown("aytCountdown", aytDate);
  </script>

</html>
