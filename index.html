<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Türkiye'nin En İyi Sayaç & Net Hesaplama</title>

<style>
:root{
  --bg:#f4f6f8;
  --primary:#1e88e5;
  --dark:#263238;
  --light:#ffffff;
  --gray:#90a4ae;
}

*{box-sizing:border-box;font-family:Inter,system-ui;}

body{
  margin:0;
  background:var(--bg);
  color:var(--dark);
}

header{
  background:var(--light);
  padding:15px 20px;
  display:flex;
  align-items:center;
  box-shadow:0 2px 10px rgba(0,0,0,.05);
}

.menu-btn{
  font-size:26px;
  cursor:pointer;
}

.title{
  flex:1;
  text-align:center;
  font-weight:600;
}

nav{
  position:fixed;
  top:0;
  left:-260px;
  width:260px;
  height:100%;
  background:var(--light);
  box-shadow:2px 0 15px rgba(0,0,0,.1);
  padding:20px;
  transition:.3s;
  z-index:1000;
}

nav.active{left:0;}

nav h3{
  margin-top:0;
  color:var(--primary);
}

nav button{
  width:100%;
  padding:12px;
  margin-bottom:8px;
  border:none;
  background:#eef3f8;
  cursor:pointer;
  border-radius:8px;
  text-align:left;
}

nav button:hover{
  background:var(--primary);
  color:#fff;
}

main{
  max-width:700px;
  margin:40px auto;
  padding:20px;
}

.card{
  background:var(--light);
  padding:30px;
  border-radius:16px;
  box-shadow:0 10px 30px rgba(0,0,0,.05);
}

.countdown{
  text-align:center;
}

.countdown h1{
  font-size:32px;
}

.timer{
  font-size:28px;
  color:var(--primary);
  margin:20px 0;
}

.date{
  color:var(--gray);
}

.calc input{
  width:100%;
  padding:12px;
  margin-bottom:10px;
  border-radius:8px;
  border:1px solid #ccc;
}

.calc button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:8px;
  background:var(--primary);
  color:white;
  font-size:16px;
  cursor:pointer;
}

.result{
  margin-top:15px;
  font-size:18px;
  text-align:center;
}
</style>
</head>

<body>

<header>
  <div class="menu-btn" onclick="toggleMenu()">☰</div>
  <div class="title">Sayaç & Net Hesaplama</div>
</header>

<nav id="menu">
  <h3>Sayaçlar</h3>
  <button onclick="showCountdown('yaz')">Yaz Tatili</button>
  <button onclick="showCountdown('yariyil')">Yarıyıl Tatili</button>

  <h3>Sınavlar</h3>
  <button onclick="showCalc('lgs')">LGS Net</button>
  <button onclick="showCalc('tyt')">TYT Net</button>
  <button onclick="showCalc('ayt')">AYT Net</button>
</nav>

<main>
  <div class="card" id="content"></div>
</main>

<script>
const dates={
  yaz:new Date("2026-06-20"),
  yariyil:new Date("2026-01-19")
};

function toggleMenu(){
  document.getElementById("menu").classList.toggle("active");
}

function showCountdown(type){
  toggleMenu();
  const names={
    yaz:"Yaz Tatiline Kalan Süre",
    yariyil:"Yarıyıl Tatiline Kalan Süre"
  };
  document.getElementById("content").innerHTML=`
  <div class="countdown">
    <h1>${names[type]}</h1>
    <div class="timer" id="timer"></div>
    <div class="date">${dates[type].toLocaleDateString("tr-TR")}</div>
  </div>`;
  updateTimer(dates[type]);
}

function updateTimer(target){
  setInterval(()=>{
    const now=new Date();
    const diff=target-now;
    if(diff<0)return;
    const d=Math.floor(diff/86400000);
    const h=Math.floor(diff/3600000)%24;
    const m=Math.floor(diff/60000)%60;
    const s=Math.floor(diff/1000)%60;
    document.getElementById("timer").innerText=
    `${d} gün ${h} saat ${m} dk ${s} sn`;
  },1000);
}

function showCalc(type){
  toggleMenu();
  const names={
    lgs:"LGS Net Hesaplama",
    tyt:"TYT Net Hesaplama",
    ayt:"AYT Net Hesaplama"
  };
  document.getElementById("content").innerHTML=`
  <h1>${names[type]}</h1>
  <div class="calc">
    <input id="dogru" type="number" placeholder="Doğru Sayısı">
    <input id="yanlis" type="number" placeholder="Yanlış Sayısı">
    <button onclick="calcNet()">Net Hesapla</button>
    <div class="result" id="result"></div>
  </div>`;
}

function calcNet(){
  const d=+dogru.value;
  const y=+yanlis.value;
  const net=d-(y/4);
  result.innerText="Net: "+net.toFixed(2);
}

// başlangıç
showCountdown("yaz");
</script>

</body>
</html>
