<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Geri Sayım Sayaçları | Tatil ve Sınav Tarihleri</title>

  <!-- Favicon -->
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/x-icon" href="favicon.ico" />

  <!-- SEO Meta Etiketleri -->
  <meta name="description" content="Yaz tatili, yarıyıl tatili ve LGS, TYT, AYT, YKS sınav geri sayım sayaçları. Doğru tarihlerle geri sayım yapın ve paylaşın." />
  <meta name="keywords" content="geri sayım, sayaç, yaz tatili, yarıyıl tatili, LGS, TYT, AYT, YKS, sınav tarihleri, Türkiye" />
  <meta name="author" content="Efe Tiras" />
  <link rel="canonical" href="https://efetiras10.github.io/Sayaclar---NetHesaplama/" />

  <!-- Open Graph -->
  <meta property="og:title" content="Geri Sayım Sayaçları | Tatil ve Sınav Tarihleri" />
  <meta property="og:description" content="Yaz tatili ve sınav geri sayım sayaçları. Doğru tarihlerle geri sayım yapın ve paylaşın." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://efetiras10.github.io/" />
  <meta property="og:image" content="https://efetiras10.github.io/Sayaclar---NetHesaplama/images/sayac-gorsel.jpeg" />

  <!-- CSS -->
  <style>
    :root {
      --bg1: #0f172a;
      --bg2: #1e293b;
      --card: #1e293b;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #3b82f6;
      --accent-dark: #1e40af;
      --border: #334155;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", Roboto, Arial, sans-serif;
      color: var(--text);
      background: linear-gradient(120deg, var(--bg1), var(--bg2));
    }

    header {
      padding: 14px 16px;
      text-align: center;
      font-weight: 600;
      font-size: 22px;
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
    }

    .menu-bar { display: flex; justify-content: center; margin: 14px 0; }
    .menu-container { position: relative; }
    .menu-button {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
    }
    .menu-button:hover { background: var(--accent-dark); transform: translateY(-1px); }

    .dropdown {
      position: absolute;
      top: 110%;
      left: 50%;
      transform: translateX(-50%);
      display: none;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      min-width: 230px;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.4);
      overflow: hidden;
      z-index: 20;
    }
    .dropdown button {
      display: block;
      width: 100%;
      text-align: left;
      padding: 12px 14px;
      background: transparent;
      color: var(--text);
      border: none;
      cursor: pointer;
      font-size: 15px;
      transition: background 0.15s ease;
    }
    .dropdown button:hover { background: #334155; }

    .container { max-width: 960px; margin: 0 auto; padding: 0 16px 28px; }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.5);
      padding: 20px 18px;
      margin: 18px auto;
      width: 100%;
      animation: fadeIn 0.5s ease;
      display: none;
    }
    .card.active { display: block; }
    .card h2 { margin: 0 0 10px 0; font-size: 20px; }

    .date-line { color: var(--muted); font-size: 14px; margin-bottom: 10px; }
    .countdown { font-variant-numeric: tabular-nums; font-size: 18px; letter-spacing: 0.3px; margin: 8px 0 18px; }

    .share { margin-top: 18px; display: flex; gap: 14px; justify-content: center; }
    .share img { width: 28px; height: 28px; object-fit: contain; border-radius: 6px; transition: transform 0.2s ease; }
    .share img:hover { transform: scale(1.1); }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Net Hesaplama stilleri */
    .calc-section { display: none; margin-top: 16px; }
    .calc-section.active { display: block; }
    input[type="number"] {
      padding: 6px;
      margin: 6px 0;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg2);
      color: var(--text);
      width: 100%;
      max-width: 240px;
    }
  </style>
</head>
<body>
  <header>📅 Geri Sayım Sayaçları</header>

  <!-- Menü ve Sayaçlar -->
  <div class="menu-bar">
    <div class="menu-container">
      <button class="menu-button" onclick="toggleMenu('menuSayac')">☰ Sayaçlar</button>
      <div id="menuSayac" class="dropdown">
        <button onclick="showSection('summer')">Yaz Tatili Sayaç</button>
        <button onclick="showSection('midterm')">Yarıyıl Tatili Sayaç</button>
        <button onclick="showSection('lgs')">LGS Sayaç</button>
        <button onclick="showSection('tyt')">TYT Sayaç</button>
        <button onclick="showSection('ayt')">AYT Sayaç</button>
      </div>
    </div>
  </div>

  <!-- Sayaç Bölümleri -->
  <div class="container">
    <!-- Yaz Tatili -->
    <section id="summer" class="card active"> ... </section>
    <!-- Yarıyıl Tatili -->
    <section id="midterm" class="card"> ... </section>
    <!-- LGS -->
    <section id="lgs" class="card"> ... </section>
    <!-- TYT -->
    <section id="tyt" class="card"> ... </section>
    <!-- AYT -->
    <section id="ayt" class="card"> ... </section>
  </div>

  <!-- Net Hesaplama Bölümü (Sayaçların altında) -->
  <section id="netHesaplama" class="card">
    <h2>Net Hesaplama</h2>
    <div class="menu-bar">
      <div class="menu-container">
        <button class="menu-button" onclick="toggleMenu('menuHesap')">☰ Hesaplama Türü</button>
        <div id="menuHesap" class="dropdown">
          <button onclick="showCalc('tytCalc')">TYT Hesaplama</button>
          <button onclick="showCalc('aytCalc')">AYT Hesaplama</button>
          <button onclick="showCalc('lgsCalc')">LGS Hesaplama</button>
        </div>
      </div>
    </div>

    <!-- TYT Hesaplama -->
    <div id="tytCalc" class="calc-section active">
      <p>TYT
          <!-- JavaScript -->
  <script>
    // Menü aç/kapat
    function toggleMenu(id) {
      const el = document.getElementById(id);
      el.style.display = (el.style.display === 'block') ? 'none' : 'block';
    }

    // Sayaç bölümleri arasında geçiş
    function showSection(id) {
      document.querySelectorAll('.card').forEach(s => s.classList.remove('active'));
      const target = document.getElementById(id);
      if (target) target.classList.add('active');
      const menu = document.getElementById('menuSayac');
      if (menu) menu.style.display = 'none';
    }

    // Net Hesaplama bölümleri arasında geçiş
    function showCalc(id) {
      document.querySelectorAll('.calc-section').forEach(s => s.classList.remove('active'));
      const target = document.getElementById(id);
      if (target) target.classList.add('active');
      const menu = document.getElementById('menuHesap');
      if (menu) menu.style.display = 'none';
    }

    // Sayaç fonksiyonu
    function startCountdown(elId, target) {
      function tick() {
        const now = new Date().getTime();
        const dist = target - now;
        if (dist <= 0) {
          document.getElementById(elId).textContent = 'Süre doldu!';
          return;
        }
        const d = Math.floor(dist / (1000 * 60 * 60 * 24));
        const h = Math.floor((dist % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const m = Math.floor((dist % (1000 * 60 * 60)) / (1000 * 60));
        const s = Math.floor((dist % (1000 * 60)) / 1000);
        document.getElementById(elId).textContent = `${d} Gün ${h} Saat ${m} Dakika ${s} Saniye kaldı`;
      }
      tick();
      return setInterval(tick, 1000);
    }

    // Tarihler
    const summerDate = new Date('June 15, 2026 00:00:00').getTime();
    const midtermDate = new Date('January 16, 2026 00:00:00').getTime();
    const lgsDate = new Date('June 14, 2026 09:30:00').getTime();
    const tytDate = new Date('June 13, 2026 10:00:00').getTime();
    const aytDate = new Date('June 14, 2026 10:00:00').getTime();

    startCountdown('summerCountdown', summerDate);
    startCountdown('midtermCountdown', midtermDate);
    startCountdown('lgsCountdown', lgsDate);
    startCountdown('tytCountdown', tytDate);
    startCountdown('aytCountdown', aytDate);

    // WhatsApp paylaşım linkleri
    function setWA(id) {
      const url = encodeURIComponent(location.href);
      const text = encodeURIComponent('Şuna bir bak: Geri Sayım Sayaçları');
      const wa = document.getElementById(id);
      if (wa) wa.href = `https://wa.me/?text=${text}%20${url}`;
    }

    setWA('shareSummerWA');
    setWA('shareMidWA');
    setWA('shareLgsWA');
    setWA('shareTytWA');
    setWA('shareAytWA');

    // Menü dışına tıklayınca kapanması için
    document.addEventListener('click', function(e) {
      const menu = document.getElementById('menuSayac');
      const btn = e.target.closest('.menu-button');
      if (!btn && menu && !e.target.closest('#menuSayac')) {
        menu.style.display = 'none';
      }
    });

    // --- Net Hesaplama Fonksiyonları ---
    function hesaplaTYT() {
      const turkce = parseFloat(document.getElementById('tytTurkce').value) || 0;
      const matematik = parseFloat(document.getElementById('tytMatematik').value) || 0;
      const fen = parseFloat(document.getElementById('tytFen').value) || 0;
      const sosyal = parseFloat(document.getElementById('tytSosyal').value) || 0;
      const puan = turkce * 3.3 + matematik * 3.3 + fen * 3.4 + sosyal * 3.4;
      document.getElementById('tytSonuc').textContent = `Tahmini TYT Puanınız: ${puan.toFixed(2)}`;
    }

    function hesaplaAYT() {
      const mat = parseFloat(document.getElementById('aytMatematik').value) || 0;
      const fizik = parseFloat(document.getElementById('aytFizik').value) || 0;
      const kimya = parseFloat(document.getElementById('aytKimya').value) || 0;
      const biyoloji = parseFloat(document.getElementById('aytBiyoloji').value) || 0;
      const puan = mat * 3 + fizik * 2.9 + kimya * 3 + biyoloji * 3.1;
      document.getElementById('aytSonuc').textContent = `Tahmini AYT Puanınız: ${puan.toFixed(2)}`;
    }

    function hesaplaLGS() {
      const turkce = parseFloat(document.getElementById('lgsTurkce').value) || 0;
      const matematik = parseFloat(document.getElementById('lgsMatematik').value) || 0;
      const fen = parseFloat(document.getElementById('lgsFen').value) || 0;
      const inkilap = parseFloat(document.getElementById('lgsInkilap').value) || 0;
      const din = parseFloat(document.getElementById('lgsDin').value) || 0;
      const ing = parseFloat(document.getElementById('lgsIng').value) || 0;
      const puan = turkce * 4 + matematik * 4.5 + fen * 4.5 + inkilap * 2 + din * 2 + ing * 2;
      document.getElementById('lgsSonuc').textContent = `Tahmini LGS Puanınız: ${puan.toFixed(2)} / 500`;
    }
  </script>
</body>
</html>
